name: links

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays, to catch external links that die between pushes
  workflow_dispatch:

jobs:
  pages:
    name: Pages and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages are up to date
        run: |
          python3 tools/gen.py
          git diff --exit-code -- site || (echo "::error::site/ is out of date: run python3 tools/gen.py and commit" && exit 1)
          test -z "$(git status --porcelain -- site)" || (git status --porcelain -- site; exit 1)
      - name: Internal links, assets and anchors
        run: python3 tools/check_links.py

  external:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Only http(s) links; internal ones are checked by tools/check_links.py.
          # LinkedIn and Instagram refuse automated requests, so they are skipped.
          args: >-
            --no-progress
            --scheme https --scheme http
            --root-dir ${{ github.workspace }}/site
            --exclude-path site/ograder/data.js
            --exclude "linkedin\.com" --exclude "instagram\.com"
            --accept 200,206,429
            --max-retries 3
            "site/**/*.html"
          fail: true
